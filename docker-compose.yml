version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: europresence_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: europresence_db
      POSTGRES_USER: europresence
      POSTGRES_PASSWORD: europresence_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U europresence -d europresence_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: europresence_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── EuroPresence App ─────────────────────────────────────────────────────
  app:
    build: .
    container_name: europresence_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://europresence:europresence_pass@db:5432/europresence_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-!}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-key-in-production-!}
      HMAC_SECRET: ${HMAC_SECRET:-change-this-hmac-secret-in-production-!}
      FLASK_ENV: ${FLASK_ENV:-production}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      QR_ROTATION_SECONDS: ${QR_ROTATION_SECONDS:-10}
      GEOFENCE_RADIUS_METERS: ${GEOFENCE_RADIUS_METERS:-80}
    ports:
      - "5000:5000"
    volumes:
      - ./app/static/images:/app/app/static/images
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
