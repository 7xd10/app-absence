<!-- Sidebar partagée pour le dashboard professeur -->
<aside class="hidden lg:flex flex-col w-64 min-h-screen bg-white border-r border-blue-soft/60 shadow-soft"
       x-data="{ open: true }">

  <!-- Logo -->
  <div class="flex items-center gap-3 p-6 border-b border-blue-soft/60">
    <div class="h-10 flex items-center justify-center">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="UEMF Logo" class="h-full object-contain"/>
    </div>
    <div>
      <p class="font-display font-bold text-primary text-sm leading-tight">EuroPresence</p>
      <p class="text-xs text-slate-400">UEMF</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 flex flex-col gap-1">
    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Principal</p>

    <a href="{{ url_for('professor.dashboard') }}"
       class="sidebar-link {% if request.endpoint == 'professor.dashboard' %}active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Tableau de bord
    </a>

    <a href="{{ url_for('professor.groups') }}"
       class="sidebar-link {% if 'groups' in request.endpoint %}active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/>
      </svg>
      Mes Groupes
    </a>

    <a href="{{ url_for('professor.sessions') }}"
       class="sidebar-link {% if 'session' in request.endpoint %}active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      Planning & Séances
    </a>

    <a href="{{ url_for('professor.messages') }}"
       class="sidebar-link {% if 'message' in request.endpoint %}active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
      </svg>
      Messages
    </a>

    <div class="border-t border-blue-soft/60 my-3"></div>
    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Compte</p>

    <a href="{{ url_for('professor.profile') }}"
       class="sidebar-link {% if 'profile' in request.endpoint %}active{% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      Mon Profil
    </a>

    <form action="{{ url_for('auth.logout') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>
      <button type="submit" class="sidebar-link w-full text-left text-red-400 hover:bg-red-50 hover:text-red-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Déconnexion
      </button>
    </form>
  </nav>

  <!-- User info -->
  <div class="p-4 border-t border-blue-soft/60">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 gradient-primary rounded-full flex items-center justify-center text-white font-bold text-sm">
        {{ current_user.first_name[0] }}{{ current_user.last_name[0] }} 
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-slate-700 truncate">{{ current_user.full_name }}</p>
        <p class="text-xs text-slate-400 truncate">{{ current_user.department or 'Professeur' }}</p>
      </div>
    </div>
  </div>
</aside>
