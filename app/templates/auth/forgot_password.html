{% extends "base.html" %}
{% block title %}Mot de passe oublié – EuroPresence{% endblock %}

{% block body %}
<div class="min-h-screen bg-gradient-to-br from-blue-soft via-white to-green-50 flex items-center justify-center p-6">
  <div class="w-full max-w-md fade-in">
    <div class="text-center mb-8">
      <div class="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow">
        <span class="text-3xl">🔑</span>
      </div>
      <h1 class="font-display font-bold text-2xl text-primary">Mot de passe oublié</h1>
      <p class="text-slate-500 mt-2">Entrez votre email pour recevoir un lien de réinitialisation</p>
    </div>

    <div class="bg-white rounded-3xl shadow-card p-8 border border-blue-soft/50">
      <form method="POST" action="{{ url_for('auth.forgot_password') }}"
            x-data="{ loading: false }" @submit="loading = true">
        <div class="mb-6">
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Adresse email</label>
          <input type="email" name="email" required placeholder="vous@uemf.ac.ma" class="input-field"/>
        </div>
        <button type="submit" :disabled="loading" class="btn-primary w-full flex items-center justify-center gap-2">
          <svg x-show="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          <span x-text="loading ? 'Envoi...' : '📧 Envoyer le lien'"></span>
        </button>
      </form>
      <div class="mt-6 text-center">
        <a href="{{ url_for('auth.login') }}" class="text-primary text-sm font-medium hover:underline">
          ← Retour à la connexion
        </a>
      </div>
    </div>

    <div class="mt-4 bg-blue-soft rounded-xl p-4 text-center">
      <p class="text-primary text-xs font-medium">⏱ Le lien de réinitialisation expire après 15 minutes</p>
    </div>
  </div>
</div>
{% endblock %}
