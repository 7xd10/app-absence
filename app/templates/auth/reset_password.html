{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe – EuroPresence{% endblock %}

{% block body %}
<div class="min-h-screen bg-gradient-to-br from-blue-soft via-white to-green-50 flex items-center justify-center p-6">
  <div class="w-full max-w-md fade-in">
    <div class="text-center mb-8">
      <div class="w-16 h-16 gradient-primary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow">
        <span class="text-3xl">🔐</span>
      </div>
      <h1 class="font-display font-bold text-2xl text-primary">Nouveau mot de passe</h1>
      <p class="text-slate-500 mt-2">Choisissez un mot de passe sécurisé pour votre compte</p>
    </div>

    <div class="bg-white rounded-3xl shadow-card p-8 border border-blue-soft/50">
      <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}"
            x-data="{ showPwd: false, loading: false }" @submit="loading = true">
        <div class="mb-5">
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Nouveau mot de passe</label>
          <div class="relative">
            <input :type="showPwd ? 'text' : 'password'" name="password" required
                   placeholder="Min. 8 caractères" class="input-field pr-12"/>
            <button type="button" @click="showPwd = !showPwd"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary p-1">
              👁
            </button>
          </div>
        </div>
        <div class="mb-8">
          <label class="block text-sm font-semibold text-slate-700 mb-1.5">Confirmer le mot de passe</label>
          <input :type="showPwd ? 'text' : 'password'" name="confirm_password" required
                 placeholder="Répétez le mot de passe" class="input-field"/>
        </div>
        <button type="submit" :disabled="loading" class="btn-primary w-full flex items-center justify-center gap-2">
          <span x-text="loading ? 'Réinitialisation...' : '✅ Réinitialiser mon mot de passe'"></span>
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
