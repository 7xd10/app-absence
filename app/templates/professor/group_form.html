{% extends "base.html" %}
{% block title %}Nouveau Groupe – EuroPresence{% endblock %}

{% block body %}
<div class="flex min-h-screen bg-slate-50">
  {% include "partials/sidebar_prof.html" %}
  <div class="flex-1 flex flex-col min-w-0">
    {% include "partials/topbar.html" %}
    <main class="flex-1 p-4 lg:p-8 overflow-auto">
      <div class="max-w-xl">
        <div class="flex items-center gap-3 mb-8">
          <a href="{{ url_for('professor.groups') }}"
             class="text-primary hover:underline text-sm font-medium">← Mes Groupes</a>
          <span class="text-slate-300">/</span>
          <span class="text-slate-600 text-sm">Nouveau groupe</span>
        </div>

        <h2 class="font-display font-bold text-2xl text-slate-800 mb-8">Créer un nouveau groupe</h2>

        <div class="bg-white rounded-2xl shadow-card border border-blue-soft/40 p-6">
          <form method="POST" action="{{ url_for('professor.new_group') }}">
            <div class="mb-4">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nom du groupe *</label>
              <input type="text" name="name" required
                     placeholder="ex: Génie Informatique S3 – Groupe A" class="input-field"/>
            </div>
            <div class="grid sm:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Filière</label>
                <input type="text" name="filiere" placeholder="ex: Génie Informatique" class="input-field"/>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Niveau</label>
                <input type="text" name="level" placeholder="ex: S3, M1, L2" class="input-field"/>
              </div>
            </div>
            <div class="mb-4">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Année académique</label>
              <input type="text" name="academic_year" placeholder="ex: 2024-2025" class="input-field"/>
            </div>
            <div class="mb-6">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Description (optionnel)</label>
              <textarea name="description" rows="3" placeholder="Notes sur le groupe..."
                        class="input-field resize-none"></textarea>
            </div>
            <div class="flex gap-3">
              <button type="submit" class="btn-primary">Créer le groupe</button>
              <a href="{{ url_for('professor.groups') }}"
                 class="border-2 border-slate-200 text-slate-600 rounded-xl py-3 px-5 text-sm font-semibold hover:bg-slate-50 transition-colors">
                Annuler
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
{% endblock %}
